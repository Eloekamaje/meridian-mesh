# Neo4j local optionnel pour la projection graphe (ADR-0013).
# Opt-in : `docker compose -f docker-compose.neo4j.yml up -d` ou `scripts/dev-neo4j-light.sh up`.
# Le mot de passe est fourni par l'environnement (NEO4J_PASSWORD) et n'est jamais versionné.
name: meridian-neo4j-light

services:
  neo4j:
    image: neo4j:5-community
    container_name: meridian-neo4j-light
    restart: "no"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?définir NEO4J_PASSWORD}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "127.0.0.1:${NEO4J_PORT:-7687}:7687"
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
    volumes:
      - meridian_neo4j_light_data:/data
    ulimits:
      nofile:
        soft: 40000
        hard: 40000
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#*/}\" 'RETURN 1;' >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

volumes:
  meridian_neo4j_light_data:
