services:
  mongodb:
    image: mongo:7.0
    container_name: meridian-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - meridian_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Bus d'événements et état des tours partagés entre workers uvicorn.
  redis:
    image: redis:7-alpine
    container_name: meridian-redis
    restart: always
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Couche cognitive du jumeau (Architecture Jumeau §4.6) ; Aurora PostgreSQL en phase 1.
  postgres:
    image: postgres:16
    container_name: meridian-postgres
    restart: always
    environment:
      POSTGRES_DB: meridian
      POSTGRES_USER: meridian
      POSTGRES_PASSWORD: ${JUMEAU_PG_PASSWORD:?définir JUMEAU_PG_PASSWORD}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - meridian_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "meridian"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  meridian_mongo_data:
  meridian_pg_data:
