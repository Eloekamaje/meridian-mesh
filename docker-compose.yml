services:
  mongodb:
    image: mongo:7.0
    container_name: meridian-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - meridian_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  meridian_mongo_data:
