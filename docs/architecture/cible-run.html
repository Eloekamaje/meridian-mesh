<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Méridian · Cycle de vie d’un run</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #f5f5f5;
      --paper-2: #ececec;
      --ink: #2d3142;
      --muted: #4f5d75;
      --soft: #6b7280;
      --accent: #bf4520;
      --link: #2e5aa8;
      --rule: rgba(45,49,66,0.12);
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    html { background: var(--paper); }
    body { font-family: var(--font-sans); background: var(--paper); color: var(--ink); padding: 3.5rem 2rem 4rem; }
    .frame { max-width: 1120px; margin: 0 auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.6rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(2rem, 4.2vw, 3.4rem); font-weight: 400; letter-spacing: -0.025em; line-height: 1.05; max-width: 900px; margin-bottom: 1rem; }
    .lede { max-width: 780px; color: var(--muted); font-size: 1rem; line-height: 1.65; margin-bottom: 2.5rem; }
    .diagram-container { width: 100%; overflow-x: auto; }
    svg { width: 100%; min-width: 960px; display: block; }
    figure { margin: 0 0 2.5rem; }
    figcaption { margin-top: 0.75rem; color: var(--muted); font-family: var(--font-mono); font-size: 0.68rem; line-height: 1.6; letter-spacing: 0.02em; }
    .section-label { font-family: var(--font-mono); font-size: 0.66rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); margin: 2.25rem 0 0.6rem; }
    .note { max-width: 780px; color: var(--muted); font-size: 0.84rem; line-height: 1.65; margin: -0.4rem 0 2.2rem; }
    .rules { display: grid; grid-template-columns: 1.1fr 1fr 0.9fr; gap: 1rem; margin: 1.25rem 0 2.75rem; }
    .rule { background: #fff; border: 1px solid var(--rule); border-radius: 6px; padding: 1.15rem 1.2rem; }
    .rule h3 { font-size: 0.95rem; font-weight: 600; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.5rem; }
    .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex: none; }
    .dot.coral { background: var(--accent); }
    .dot.muted { background: var(--muted); }
    .dot.link { background: var(--link); }
    .rule p { color: var(--muted); font-size: 0.82rem; line-height: 1.55; }
    .runtime { width: 100%; border-collapse: collapse; margin-top: 0.5rem; font-size: 0.82rem; }
    .runtime th { text-align: left; font-family: var(--font-mono); font-size: 0.62rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); font-weight: 500; padding: 0 0 0.6rem; border-bottom: 1px solid var(--rule); }
    .runtime td { vertical-align: top; padding: 0.7rem 0; border-bottom: 1px solid var(--rule); color: var(--muted); line-height: 1.5; }
    .runtime td:first-child { color: var(--ink); font-weight: 600; width: 18%; padding-right: 1rem; }
    .runtime code { font-family: var(--font-mono); font-size: 0.75rem; color: var(--ink); }
    .limit { margin-top: 2.5rem; padding-top: 1.25rem; border-top: 1px solid var(--rule); color: var(--soft); font-size: 0.76rem; line-height: 1.65; }
    .limit strong { color: var(--muted); font-weight: 600; }
    footer { margin-top: 2.5rem; padding-top: 1rem; border-top: 1px solid var(--rule); color: var(--soft); font-family: var(--font-mono); font-size: 0.62rem; letter-spacing: 0.04em; display: flex; justify-content: space-between; gap: 1rem; }
    @media (max-width: 760px) { body { padding: 2rem 1rem 3rem; } .rules { grid-template-columns: 1fr; } .runtime td:first-child { width: auto; } }
    @media print { body { padding: 0; } .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <main class="frame">
    <header>
      <p class="eyebrow">Méridian · Cible proposée · Octobre 2026</p>
      <h1>Cycle de vie d’un run</h1>
      <p class="lede">Un run est un état, pas une tâche asynchrone.</p>

          <rect x="256" y="184" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
          <text x="270" y="193" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RUN</text>

          <rect x="496" y="272" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
          <text x="514" y="281" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WAIT</text>
          <text x="568" y="302" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">WAITING_RETRY</text>
          <text x="568" y="318" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">backoff · timer</text>

          <rect x="736" y="176" width="144" height="64" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <rect x="744" y="184" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
          <text x="758" y="193" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OK</text>
          <text x="808" y="214" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">SUCCEEDED</text>
          <text x="808" y="230" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">terminal</text>

          <rect x="736" y="288" width="144" height="64" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <rect x="744" y="296" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
          <text x="758" y="305" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ERR</text>

          <text x="320" y="398" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">terminal</text>

          <rect x="48" y="344" width="144" height="64" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <rect x="56" y="352" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
          <text x="70" y="361" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TMO</text>
          <text x="120" y="382" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">EXPIRED</text>
          <text x="120" y="398" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">terminal</text>

          <line x1="40" y1="480" x2="920" y2="480" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
          <text x="40" y="500" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">TERMINAL : SUCCEEDED · FAILED · CANCELLED · EXPIRED</text>
          <text x="700" y="500" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">HUMAN GATE EN CORAIL</text>
        </svg></div>
      <figcaption>Fig. 2 — Un run n’est jamais « une tâche asyncio » : il a un état, un bail, une deadline, une annulation et une reprise.</figcaption>
    </figure>
    <footer><span>Méridian · cible hexagonale · skin Diagram Design par défaut</span><span>ADR-0010 → 0015</span></footer>
  </main>
</body>
</html>
