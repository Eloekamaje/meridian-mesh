<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Méridian · Commande, streaming, lecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #f5f5f5;
      --paper-2: #ececec;
      --ink: #2d3142;
      --muted: #4f5d75;
      --soft: #6b7280;
      --accent: #bf4520;
      --link: #2e5aa8;
      --rule: rgba(45,49,66,0.12);
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    html { background: var(--paper); }
    body { font-family: var(--font-sans); background: var(--paper); color: var(--ink); padding: 3.5rem 2rem 4rem; }
    .frame { max-width: 1120px; margin: 0 auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.6rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(2rem, 4.2vw, 3.4rem); font-weight: 400; letter-spacing: -0.025em; line-height: 1.05; max-width: 900px; margin-bottom: 1rem; }
    .lede { max-width: 780px; color: var(--muted); font-size: 1rem; line-height: 1.65; margin-bottom: 2.5rem; }
    .diagram-container { width: 100%; overflow-x: auto; }
    svg { width: 100%; min-width: 960px; display: block; }
    figure { margin: 0 0 2.5rem; }
    figcaption { margin-top: 0.75rem; color: var(--muted); font-family: var(--font-mono); font-size: 0.68rem; line-height: 1.6; letter-spacing: 0.02em; }
    .section-label { font-family: var(--font-mono); font-size: 0.66rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); margin: 2.25rem 0 0.6rem; }
    .note { max-width: 780px; color: var(--muted); font-size: 0.84rem; line-height: 1.65; margin: -0.4rem 0 2.2rem; }
    .rules { display: grid; grid-template-columns: 1.1fr 1fr 0.9fr; gap: 1rem; margin: 1.25rem 0 2.75rem; }
    .rule { background: #fff; border: 1px solid var(--rule); border-radius: 6px; padding: 1.15rem 1.2rem; }
    .rule h3 { font-size: 0.95rem; font-weight: 600; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.5rem; }
    .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex: none; }
    .dot.coral { background: var(--accent); }
    .dot.muted { background: var(--muted); }
    .dot.link { background: var(--link); }
    .rule p { color: var(--muted); font-size: 0.82rem; line-height: 1.55; }
    .runtime { width: 100%; border-collapse: collapse; margin-top: 0.5rem; font-size: 0.82rem; }
    .runtime th { text-align: left; font-family: var(--font-mono); font-size: 0.62rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); font-weight: 500; padding: 0 0 0.6rem; border-bottom: 1px solid var(--rule); }
    .runtime td { vertical-align: top; padding: 0.7rem 0; border-bottom: 1px solid var(--rule); color: var(--muted); line-height: 1.5; }
    .runtime td:first-child { color: var(--ink); font-weight: 600; width: 18%; padding-right: 1rem; }
    .runtime code { font-family: var(--font-mono); font-size: 0.75rem; color: var(--ink); }
    .limit { margin-top: 2.5rem; padding-top: 1.25rem; border-top: 1px solid var(--rule); color: var(--soft); font-size: 0.76rem; line-height: 1.65; }
    .limit strong { color: var(--muted); font-weight: 600; }
    footer { margin-top: 2.5rem; padding-top: 1rem; border-top: 1px solid var(--rule); color: var(--soft); font-family: var(--font-mono); font-size: 0.62rem; letter-spacing: 0.04em; display: flex; justify-content: space-between; gap: 1rem; }
    @media (max-width: 760px) { body { padding: 2rem 1rem 3rem; } .rules { grid-template-columns: 1fr; } .runtime td:first-child { width: auto; } }
    @media print { body { padding: 0; } .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <main class="frame">
    <header>
      <p class="eyebrow">Méridian · Cible proposée · Octobre 2026</p>
      <h1>Commande, streaming, lecture</h1>
      <p class="lede">La commande est durable ; le flux est rejouable.</p>
    </header>
    <figure>

          </defs>

          <line x1="290" y1="120" x2="290" y2="560" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>

          <rect x="286" y="164" width="8" height="392" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
          <rect x="476" y="280" width="8" height="168" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

          <line x1="100" y1="168" x2="290" y2="168" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#seq-arrow-link)"/>

          <text x="398" y="199" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">PERSIST</text>

          <line x1="290" y1="248" x2="100" y2="248" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#seq-arrow)"/>
          <rect x="160" y="230" width="56" height="12" rx="2" fill="#f5f5f5"/>
          <text x="188" y="239" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">202 + RUN</text>

          <text x="572" y="319" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">PROPOSE</text>

          <line x1="290" y1="448" x2="670" y2="448" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#seq-arrow)"/>

          <text x="174" y="519" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">SSE</text>

          <rect x="40" y="64" width="120" height="56" rx="6" fill="#f5f5f5"/>

          <text x="290" y="102" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">HTTP · SSE</text>

          <rect x="420" y="64" width="120" height="56" rx="6" fill="#f5f5f5"/>
          <rect x="420" y="64" width="120" height="56" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>

          <text x="480" y="102" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">run · outbox</text>

          <rect x="610" y="64" width="120" height="56" rx="6" fill="#f5f5f5"/>
          <rect x="610" y="64" width="120" height="56" rx="6" fill="rgba(79,93,117,0.08)" stroke="#4f5d75" stroke-width="1"/>
          <text x="670" y="86" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Postgres</text>
          <text x="670" y="102" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">run · event</text>

          <rect x="800" y="64" width="120" height="56" rx="6" fill="#f5f5f5"/>
          <rect x="800" y="64" width="120" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <text x="860" y="86" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Agent</text>

          <line x1="40" y1="580" x2="920" y2="580" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
          <text x="40" y="596" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
          <line x1="140" y1="596" x2="168" y2="596" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#seq-arrow-link)"/>
          <text x="176" y="599" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Appel sync</text>
          <line x1="270" y1="596" x2="298" y2="596" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#seq-arrow)"/>
          <text x="306" y="599" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Retour</text>
          <line x1="390" y1="596" x2="418" y2="596" stroke="#bf4520" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#seq-arrow-open)"/>
          <text x="426" y="599" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">SSE / async</text>
          <text x="560" y="599" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Les requêtes de lecture seules restent synchrones, sans run.</text>
        </svg></div>
      <figcaption>Fig. 3 — La commande est persistée avant le 202 ; le worker est le seul à produire des effets ; le flux SSE rejoue le journal, pas la mémoire du process.</figcaption>
    </figure>
    <footer><span>Méridian · cible hexagonale · skin Diagram Design par défaut</span><span>ADR-0010 → 0015</span></footer>
  </main>

</html>
