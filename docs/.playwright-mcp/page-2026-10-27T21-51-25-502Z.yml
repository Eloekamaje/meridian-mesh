                  - listitem [ref=f2e107]: → Présenter le projet à des évaluateurs, en anglais et en arabe, avec un scénario guidé et une planche récapitulative
                  - listitem [ref=f2e108]: "→ Traiter les cas sensibles : accès d'urgence encadré, recherche par code personnel, revue des conflits entre terrain et central"
                  - listitem [ref=f2e109]: "→ Travailler le dossier : vérification, historique consolidé, consentement, orientations, pilotage, administration"
              - generic [ref=f2e110]:
                - generic [ref=f2e111]: 2 · Pour qui, dans quels parcours
