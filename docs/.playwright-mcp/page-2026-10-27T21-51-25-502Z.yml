                  - listitem [ref=f2e122]: "→ Les traces d'accès d'urgence : motif nommé, durée, session enregistrée, journal d'audit"
                  - listitem [ref=f2e123]: → Un historique consolidé présenté comme infalsifiable, avec simulation d'altération
                  - listitem [ref=f2e124]: → Un profil de détresse distinct du dossier réel, jamais synchronisé
