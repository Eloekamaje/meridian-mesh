                - generic [ref=f2e103]: 1 · À quoi elle sert
                - list [ref=f2e104]:
                  - listitem [ref=f2e105]: "→ Dérouler le parcours de terrain de bout en bout : ouverture par code, saisie hors ligne, synchronisation, détection des doublons, droits d'accès"
