                  - listitem [ref=f2e114]: → Les équipes de terrain, à l'ouverture de session, à la saisie et à la synchronisation
                  - listitem [ref=f2e115]: → Les évaluateurs du dossier, qui jouent le scénario complet de la saisie hors ligne jusqu'à la décision du réviseur
                  - listitem [ref=f2e116]: → Les réviseurs en portail, à l'étape de vérification puis de revue des doublons et des conflits
              - generic [ref=f2e117]:
                - generic [ref=f2e118]: 3 · Les informations qu'elle détient
                - list [ref=f2e119]:
                  - listitem [ref=f2e120]: "→ Des dossiers de personnes en données synthétiques : la maquette n'est pas la référence des vraies personnes"
