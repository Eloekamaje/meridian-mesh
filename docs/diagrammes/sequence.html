<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Séquence — une question dans le Travail</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #071019;
      --color-paper-2: #0C1724;
      --color-ink: #F2F6F8;
      --color-muted: #7C93A8;
      --color-soft: #94A3B8;
      --color-rule: rgba(255,255,255,0.08);
      --color-accent: #60A5FA;
      --color-accent-tint: rgba(96,165,250,0.12);
      --color-link: #93C5FD;
      --font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      --font-serif: ui-serif, Georgia, "Times New Roman", serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 32px;
    }
    .frame { max-width: 1240px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 8px;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 24px;
    }
    .diagram-container { width: 100%; overflow-x: auto; }
    svg { width: 100%; min-width: 1200px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
