<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 1080" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cognition-title cognition-desc" id="architecture-cognitive-root">
        <title id="cognition-title">Architecture cognitive de Méridian</title>
        <desc id="cognition-desc">Pipeline cognitif en neuf étapes : entrée, qualification et cadrage, contexte et mémoire, épistémique, composition, dossier de raisonnement, critique et gates, décision et réponse, outcome et apprentissage, avec une boucle de retour vers le contexte.</desc>
        <defs>
      <style>#architecture-cognitive-root { --color-paper: #071019;
      --color-paper-2: #0C1724;
      --color-ink: #F2F6F8;
      --color-muted: #7C93A8;
      --color-soft: #94A3B8;
      --color-rule: rgba(255,255,255,0.08);
      --color-accent: #60A5FA;
      --color-accent-tint: rgba(96,165,250,0.12);
      --color-link: #93C5FD;
      --font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      --font-serif: ui-serif, Georgia, "Times New Roman", serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      #architecture-cognitive-root { font-family: var(--font-sans); color: var(--color-ink); }
      #architecture-cognitive-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#architecture-cognitive-root .diagram-container { overflow-x: visible; }
}</style>
